<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Upsy, a friendly battery with a daisy</title>
  <defs>
    <clipPath id="body"><rect x="136" y="156" width="240" height="282" rx="72"/></clipPath>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="256" cy="486" rx="132" ry="14" fill="#3A2A22" opacity=".14"/>
  <!-- legs -->
  <g stroke="#3A2A22" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M206 424 v36 q0 14 -16 14 h-14 q-16 0 -12 -12 q6 -14 22 -14" fill="#2F7F7A"/>
    <path d="M306 424 v36 q0 14 16 14 h14 q16 0 12 -12 q-6 -14 -22 -14" fill="#2F7F7A"/>
  </g>
  <!-- arms: left waving, right on hip -->
  <g stroke="#3A2A22" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M144 300 q-44 -18 -50 -74"/>
    <path d="M368 300 q40 18 30 66"/>
  </g>
  <g fill="#E3A72F" stroke="#3A2A22" stroke-width="10" stroke-linejoin="round">
    <ellipse cx="72" cy="216" rx="11" ry="9" transform="rotate(-30 72 216)"/>
    <ellipse cx="94" cy="206" rx="19" ry="24" transform="rotate(-12 94 206)"/>
    <ellipse cx="414" cy="378" rx="10" ry="8" transform="rotate(20 414 378)"/>
    <ellipse cx="398" cy="372" rx="19" ry="17"/>
  </g>
  <!-- terminal cap -->
  <rect x="204" y="122" width="104" height="48" rx="16" fill="#2F7F7A" stroke="#3A2A22" stroke-width="12"/>
  <rect x="222" y="134" width="30" height="8" rx="4" fill="#7FB8B0"/>
  <!-- daisy on a stem -->
  <path d="M272 124 q4 -38 30 -62" fill="none" stroke="#3A2A22" stroke-width="12" stroke-linecap="round"/>
  <path d="M272 124 q4 -38 30 -62" fill="none" stroke="#7A8F35" stroke-width="4" stroke-linecap="round"/>
  <path d="M276 96 q-30 -12 -40 -36 q28 2 40 36z" fill="#7A8F35" stroke="#3A2A22" stroke-width="8" stroke-linejoin="round"/>
  <g transform="translate(308 54)" stroke="#3A2A22" stroke-width="7" fill="#F6ECD6">
    <ellipse rx="10" ry="22" transform="rotate(0) translate(0 -22)"/>
    <ellipse rx="10" ry="22" transform="rotate(60) translate(0 -22)"/>
    <ellipse rx="10" ry="22" transform="rotate(120) translate(0 -22)"/>
    <ellipse rx="10" ry="22" transform="rotate(180) translate(0 -22)"/>
    <ellipse rx="10" ry="22" transform="rotate(240) translate(0 -22)"/>
    <ellipse rx="10" ry="22" transform="rotate(300) translate(0 -22)"/>
    <circle r="15" fill="#D2602F"/>
  </g>
  <!-- body -->
  <rect x="136" y="156" width="240" height="282" rx="72" fill="#E3A72F"/>
  <g clip-path="url(#body)">
    <!-- charge window: the lower belly is the charge level -->
    <rect x="120" y="356" width="280" height="100" fill="#2F7F7A"/>
    <path d="M120 356 q34 -12 68 0 t68 0 t68 0 t68 0 v8 h-272z" fill="#2F7F7A"/>
    <!-- right-side shade -->
    <rect x="336" y="140" width="60" height="320" fill="#3A2A22" opacity=".12"/>
    <!-- top-left highlight -->
    <path d="M168 230 q2 -40 36 -50" fill="none" stroke="#F6ECD6" stroke-width="12" stroke-linecap="round" opacity=".7"/>
  </g>
  <rect x="136" y="156" width="240" height="282" rx="72" fill="none" stroke="#3A2A22" stroke-width="12"/>
  <!-- bolt on the belly -->
  <path d="M262 368 l-26 40 h20 l-8 30 l30 -44 h-20 z" fill="#F6ECD6" stroke="#3A2A22" stroke-width="7" stroke-linejoin="round"/>
  <!-- face -->
  <g stroke="#3A2A22" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M196 226 q16 -12 34 -4"/>
    <path d="M282 222 q18 -8 34 4"/>
  </g>
  <ellipse cx="216" cy="270" rx="24" ry="28" fill="#F6ECD6" stroke="#3A2A22" stroke-width="10"/>
  <ellipse cx="296" cy="270" rx="24" ry="28" fill="#F6ECD6" stroke="#3A2A22" stroke-width="10"/>
  <circle cx="222" cy="276" r="12" fill="#3A2A22"/>
  <circle cx="302" cy="276" r="12" fill="#3A2A22"/>
  <circle cx="226" cy="271" r="4" fill="#F6ECD6"/>
  <circle cx="306" cy="271" r="4" fill="#F6ECD6"/>
  <circle cx="182" cy="314" r="14" fill="#D2602F" opacity=".75"/>
  <circle cx="330" cy="314" r="14" fill="#D2602F" opacity=".75"/>
  <path d="M234 318 q22 22 44 0" fill="#3A2A22" stroke="#3A2A22" stroke-width="8" stroke-linejoin="round"/>
</svg>
