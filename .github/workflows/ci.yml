name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore upsy.slnx
      - run: dotnet build upsy.slnx -c Release --no-restore
      - run: dotnet test --solution upsy.slnx -c Release --no-build
      - run: dotnet format upsy.slnx --verify-no-changes --no-restore
